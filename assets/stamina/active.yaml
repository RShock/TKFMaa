version: 1

defaults:
  activity_section:
    expected: ["目前活动"]
    roi: [270, 90, 180, 80]
  activity_name_roi: [70, 770, 580, 60]
  stage_roi: [0, 160, 720, 1000]
  stamina_roi: [500, 0, 180, 45]
  reserve: 0

templates:
  daily_affairs_list:
    route_type: daily_affairs

activities:
  - name: "日常调教本"
    description: "出征 → 目前活动 → 每日政务（图片）→ 调教 → 开发IV → 开始，随后再次挑战；仅匹配固定短文字，适配每日变化的属性，单次消耗15体力。"
    template: daily_affairs_list
    activity_section:
      expected: ["目前活动"]
      roi: [270, 90, 180, 80]
    activity_name:
      expected: ["日常政务"]
      recognition:
        type: TemplateMatch
        param:
          template: "DailyStamina/DailyAffairs720.png"
          roi: [350, 380, 290, 110]
          threshold: 0.8
    daily_affairs:
      category:
        expected: ["调教"]
        roi: [350, 120, 300, 1120]
    stage:
      expected: ['开发\s*(IV|Ⅳ)\s*$']
      roi: [160, 145, 320, 800]
      any_selectable:
        expected: ["Lv"]
        roi: [80, 110, 100, 600]
    stamina:
      cost: 15
    extra_overrides:
      DailyStaminaOpenTargetStage:
        action:
          param:
            target_offset: [0, 0, 0, 0]
      DailyStaminaStageDetailInitialDecision:
        next:
          - "[Anchor]DailyStaminaLowDecision"
          - "DailyStaminaRefillWithPotionWhenLow"
          - "DailyStaminaRefillWithCurrencyWhenLow"
          - "DailyStaminaReturnMainWhenLow"
          - "DailyStaminaTrainingStart"
      DailyStaminaTrainingResumeStart:
        enabled: true
      DailyStaminaTrainingFinishWhenLow:
        enabled: true
      DailyStaminaRefillWithPotionWhenLow:
        action:
          param:
            target: [360, 1143]
      DailyStaminaRefillWithCurrencyWhenLow:
        action:
          param:
            target: [360, 1143]
      DailyStaminaUsePotionPopup:
        next:
          - "[JumpBack]CommonWaitLoading"
          - "DailyStaminaCloseStaminaPurchasePopupAfterRefill"
          - "DailyStaminaStageDetailInitialDecision"
      DailyStaminaCloseStaminaPurchasePopupAfterRefill:
        next:
          - "[JumpBack]CommonWaitLoading"
          - "DailyStaminaStageDetailInitialDecision"
      DailyStaminaCurrencyPurchasedState:
        next:
          - "[JumpBack]CommonWaitLoading"
          - "DailyStaminaCloseStaminaPurchasePopupAfterRefill"
          - "DailyStaminaReturnMainWhenLow"
          - "DailyStaminaTrainingStart"
          - "DailyStaminaReturnMainFromStageDetail"
